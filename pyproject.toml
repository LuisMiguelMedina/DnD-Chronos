[project]
name = "dungeonchronicler"
version = "0.1.0"
description = "Copiloto de Discord para narradores: resume la sesión y, tras aprobación, la guarda en Obsidian."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3",
    "google-genai>=3,<4",
    "httpx>=0.27",
    "PyYAML>=6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
